spring.application.name=taskflow

# Database (override with env vars: DB_URL, DB_USER, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5999/taskflow}
spring.datasource.username=${DB_USER:taskflow}
spring.datasource.password=${DB_PASSWORD:taskflow}

# Schema is created by db/schema.sql; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JSP views
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
